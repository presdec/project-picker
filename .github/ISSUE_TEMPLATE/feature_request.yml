name: Feature request
description: Suggest an improvement or new capability.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Project Picker do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Linux, macOS, WSL, MSYS2, Cygwin, Git Bash"
